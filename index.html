<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baku Resources Map</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Baku Resources" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header id="app-header">
  <h1>Baku Resources</h1>
  <select id="category-select" aria-label="Select category"></select>

  <div id="auth-signed-out">
    <input id="auth-email" type="text" placeholder="Shared username" aria-label="Username" autocomplete="username" />
    <input id="auth-password" type="password" placeholder="Shared password" aria-label="Password" autocomplete="current-password" />
    <button id="auth-send-link" type="button">Sign in</button>
    <span id="auth-status"></span>
  </div>
  <div id="auth-signed-in" hidden>
    <span id="auth-user-email"></span>
    <button id="add-venue-btn" type="button">+ Add venue</button>
    <button id="auth-sign-out" type="button">Sign out</button>
  </div>
</header>

<div id="map">
  <button id="about-btn" type="button">About</button>
  <button id="locate-btn" type="button">📍 My location</button>
</div>

<div id="add-venue-panel" hidden>
  <button id="add-venue-close" type="button" aria-label="Close">&times;</button>
  <h2>Add a venue</h2>
  <p class="hint">Search a name, or click the map to drop a pin.</p>

  <div id="add-venue-search">
    <input id="add-venue-query" type="text" placeholder="Search place name…" />
    <button id="add-venue-search-btn" type="button">Search</button>
  </div>
  <ul id="add-venue-results"></ul>

  <p id="add-venue-location">No location chosen yet.</p>

  <form id="add-venue-form">
    <input id="add-venue-name" type="text" placeholder="Name" required />
    <select id="add-venue-category" aria-label="Category"></select>
    <textarea id="add-venue-description" placeholder="Description (optional)"></textarea>
    <input id="add-venue-address" type="text" placeholder="Address (optional)" />
    <input id="add-venue-url" type="url" placeholder="Website (optional)" />
    <button id="add-venue-save" type="submit">Save venue</button>
  </form>
</div>

<div id="venue-list-panel">
  <button id="venue-list-toggle" type="button"></button>
  <div id="venue-list-body">
    <input id="venue-list-search" type="text" placeholder="Search by name, description or comment…" aria-label="Search venues" />
    <ul id="venue-list"></ul>
  </div>
</div>

<div id="loading" hidden>Loading…</div>

<div id="about-overlay" hidden>
  <div id="about-modal">
    <button id="about-close" type="button" aria-label="Close">&times;</button>
    <div id="about-content"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/venues-db.js"></script>
<script src="js/geocode.js"></script>
<script src="js/about.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
