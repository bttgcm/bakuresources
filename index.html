<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baku Resources Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header id="app-header">
  <h1>Baku Resources</h1>
  <select id="category-select" aria-label="Select category"></select>
</header>

<div id="auth-bar">
  <div id="auth-signed-out">
    <input id="auth-email" type="text" placeholder="Shared username" aria-label="Username" autocomplete="username" />
    <input id="auth-password" type="password" placeholder="Shared password" aria-label="Password" autocomplete="current-password" />
    <button id="auth-send-link" type="button">Sign in</button>
    <span id="auth-status"></span>
  </div>
  <div id="auth-signed-in" hidden>
    <span id="auth-user-email"></span>
    <button id="add-venue-btn" type="button">+ Add venue</button>
    <button id="auth-sign-out" type="button">Sign out</button>
  </div>
</div>

<div id="map"></div>

<div id="add-venue-panel" hidden>
  <button id="add-venue-close" type="button" aria-label="Close">&times;</button>
  <h2>Add a venue</h2>
  <p class="hint">Search a name, or click the map to drop a pin.</p>

  <div id="add-venue-search">
    <input id="add-venue-query" type="text" placeholder="Search place name…" />
    <button id="add-venue-search-btn" type="button">Search</button>
  </div>
  <ul id="add-venue-results"></ul>

  <p id="add-venue-location">No location chosen yet.</p>

  <form id="add-venue-form">
    <input id="add-venue-name" type="text" placeholder="Name" required />
    <textarea id="add-venue-description" placeholder="Description (optional)"></textarea>
    <input id="add-venue-address" type="text" placeholder="Address (optional)" />
    <input id="add-venue-url" type="url" placeholder="Website (optional)" />
    <button id="add-venue-save" type="submit">Save venue</button>
  </form>
</div>

<div id="unlocated-panel" hidden>
  <button id="unlocated-toggle" type="button"></button>
  <ul id="unlocated-list"></ul>
</div>

<div id="loading" hidden>Loading…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/venues-db.js"></script>
<script src="js/geocode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
